<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click the Target - Game</title>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #1a1a2e; color: white; font-family: Arial, sans-serif; overflow: hidden; }
        #back-home { position: fixed; top: 15px; left: 15px; background: #d6336c; color: white; padding: 10px 18px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 14px; z-index: 9999; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: background 0.2s; }
        #back-home:hover { background: #b02a5b; }
        #score-board { font-size: 2rem; margin-bottom: 10px; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        #timer-board { font-size: 1.5rem; margin-bottom: 20px; color: #00cec9; font-weight: bold; }
        #game-container { position: relative; width: 100%; max-width: 800px; height: 60vh; background-color: #16213e; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #target { position: absolute; width: 80px; height: 80px; background: radial-gradient(circle, #ff6b6b, #d6336c); border-radius: 50%; cursor: pointer; display: none; box-shadow: 0 0 20px rgba(255, 107, 107, 0.8); transition: transform 0.1s; transform: translate(-50%, -50%); z-index: 10; }
        #target:active { transform: translate(-50%, -50%) scale(0.9); }
        #ad-banner { width: 100%; max-width: 800px; height: 90px; margin-top: 20px; background-color: #0f0f1a; display: flex; justify-content: center; align-items: center; border-radius: 10px; overflow: hidden; color: #6c6c8a; font-size: 14px; }
    </style>
</head>
<body>

    <a href="https://boussedraoui.github.io/" id="back-home">← Back to Home</a>

    <div id="score-board">Score: <span id="score">0</span></div>
    <div id="timer-board">Time: <span id="timer">30</span>s</div>

    <div id="game-container">
        <div id="target"></div>
    </div>

    <!-- Ad Banner Container with Status Text -->
    <div id="ad-banner">
        <div id="gamemonetize-banner" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            Waiting for Ad SDK...
        </div>
    </div>

    <script src="https://api.gamemonetize.com/sdk.js"></script>

    <script>
        var sdk = null;
        const adBanner = document.getElementById('gamemonetize-banner');

        try {
            sdk = new SDK({ gameId: '4kci7og3klgj0ivy2wz3gdvd9dth5e7n' });
            adBanner.textContent = "Ad SDK Loaded. Requesting Banner...";
        } catch (e) {
            console.error("SDK initialization failed:", e);
            adBanner.textContent = "Ad SDK Failed to Load.";
        }

        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let timerInterval = null;
        
        const target = document.getElementById('target');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const container = document.getElementById('game-container');

        function moveTarget() {
            const containerRect = container.getBoundingClientRect();
            const targetSize = 80;
            const maxX = containerRect.width - targetSize;
            const maxY = containerRect.height - targetSize;
            target.style.left = (Math.floor(Math.random() * maxX) + (targetSize / 2)) + 'px';
            target.style.top = (Math.floor(Math.random() * maxY) + (targetSize / 2)) + 'px';
        }

        function startGame() {
            if (gameActive) return;
            
            if (sdk) {
                try { 
                    sdk.showBanner('gamemonetize-banner'); 
                    adBanner.textContent = ""; // Clear text if banner loads
                } catch (e) { 
                    console.error("Banner error:", e);
                    adBanner.textContent = "Banner ad failed to display.";
                }
            } else {
                adBanner.textContent = "No SDK available for ads.";
            }

            score = 0;
            scoreDisplay.textContent = score;
            timeLeft = 30;
            timerDisplay.textContent = timeLeft;
            gameActive = true;
            
            target.style.display = 'block';
            target.style.left = '50%';
            target.style.top = '50%';

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            target.style.display = 'none';

            if (sdk) {
                try { sdk.showInterstitial(); } 
                catch (e) { console.error("Interstitial error:", e); }
            }

            scoreDisplay.innerHTML = `Game Over! Score: ${score}`;
            setTimeout(() => { startGame(); }, 3000);
        }

        target.addEventListener('click', () => {
            if (!gameActive) return;
            score++;
            scoreDisplay.textContent = score;
            moveTarget();

            if (sdk && score > 0 && score % 5 === 0) {
                try { sdk.showInterstitial(); } 
                catch (e) { console.error("Interstitial error:", e); }
            }
        });

        window.addEventListener('resize', () => { if (gameActive) moveTarget(); });
        window.addEventListener('load', () => { setTimeout(startGame, 1000); });
    </script>

</body>
</html>
